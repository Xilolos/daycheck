<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <title>DayCheck</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg"/>
  <link rel="apple-touch-icon" href="/logo.jpg"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#ffffff"/>
  <script>
    (function(){
      try {
        var mode = localStorage.getItem('dc_themeMode') || 'system';
        var amoled = localStorage.getItem('dc_amoled') === 'true';
        var sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = mode === 'dark' || (mode === 'system' && sysDark);
        var bg = dark ? (amoled ? '#000000' : '#0B0B0C') : '#ffffff';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        document.body && (document.body.style.background = bg);
      } catch(e){}
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="DayCheck"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
